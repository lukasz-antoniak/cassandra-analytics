name: Build

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          cache: 'gradle'
      - name: Setup Environment
        run: |
          sudo bash -c 'for i in {2..20}; do echo 127.0.0.${i} localhost${i} >> /etc/hosts; done'
          sudo bash -c 'for i in {2..20}; do ifconfig lo:${i} 127.0.0.${i} netmask 255.0.0.0 up; done'
          
          apt-get download ant ant-optional
          sudo dpkg --force-all -i ant*.deb
          rm ant*.deb
          
          chmod +x gradlew
      - name: Build
        run: |
          CASSANDRA_USE_JDK11=true ./scripts/build-dependencies.sh
          ./gradlew --stacktrace clean assemble check -x test
      - name: Unit test
        run: |
          ./gradlew --stacktrace test -x cassandra-analytics-integration-tests:test